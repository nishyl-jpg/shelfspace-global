<head>

<style>

  .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
  a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:700;text-decoration:none}
  a.p{background:#D90000;color:#fff}
  a.g{color:#F3F3F1;border:1px solid #343434}

</head>
<body>
<main>
  <div class="mark"><span class="tile" aria-hidden="true"><i></i><i></i></span><span>Shelfspace Global</span></div>
