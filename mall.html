const { useState, useEffect, useRef, useMemo } = React;

/* ---------- primitives ---------- */

function Button({ variant = "outline", href, className = "", children, ...props }) {
  const base = "inline-flex items-center justify-center min-h-[44px] rounded-full font-bold text-[0.9rem] px-5 no-underline transition-[filter,background-color,transform] duration-150 active:scale-[0.98]";
  const styles = {
    primary: "bg-accentstrong text-accentink hover:brightness-110",
    outline: "bg-surface text-ink border border-line hover:bg-surface2",
    compact: "bg-accentstrong text-accentink hover:brightness-110 px-4 text-[0.85rem]"
  };
  const cls = base + " " + (styles[variant] || styles.outline) + " " + className;
  if (href) return <a href={href} className={cls} {...props}>{children}</a>;
  return <button type="button" className={cls} {...props}>{children}</button>;
}

function Badge({ className = "", children }) {
  return (
    <span className={"font-mono text-[0.75rem] font-semibold tracking-wide bg-surface2 border border-line px-2.5 py-1 rounded-full text-inkmuted " + className}>
      {children}
    </span>
  );
}

function Card({ className = "", children }) {
  return (
    <div className={"bg-surface border border-line rounded-2xl shadow-[0_16px_32px_-20px_var(--shadow)] " + className}>
      {children}
    </div>
  );
}

function Eyebrow({ className = "", children }) {
  return (
    <p className={"font-mono text-[0.75rem] font-semibold tracking-[0.14em] uppercase text-inkmuted " + className}>
      {children}
    </p>
  );
}

function CodeChip({ code, item, className, style }) {
  const [state, setState] = useState("idle");
  const ref = useRef(null);
  const done = (s) => { setState(s); setTimeout(() => setState("idle"), 1400); };
  const selectText = () => {
    try {
      const range = document.createRange();
      range.selectNodeContents(ref.current.querySelector("[data-code]"));
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) {}
    done("select");
  };
  const copy = (e) => {
    e.stopPropagation();
    try {
      navigator.clipboard.writeText(code).then(() => done("copied")).catch(selectText);
    } catch (err) { selectText(); }
  };
  const label = state === "copied" ? "Copied" : state === "select" ? "Press Ctrl+C" : code;
  return (
    <button
      ref={ref}
      type="button"
      onClick={copy}
      aria-label={"Copy code " + code + " for " + item}
      style={style}
      className={className || "font-mono text-[0.78rem] font-semibold bg-chipbg text-chipink min-h-[40px] min-w-[84px] px-3 rounded-lg tracking-wide whitespace-nowrap flex-none transition-colors hover:bg-accentstrong hover:text-accentink active:scale-95"}
    >
      <span data-code className={state === "idle" ? "" : "sr-only"}>{code}</span>
      {state !== "idle" && <span aria-live="polite">{label}</span>}
    </button>
  );
}

function LogoTile({ w = 26, h = 20 }) {

        <rect y="7.6" width="14" height="2.4" rx="1.2" fill="#FFFFFF" />
      </svg>
    </span>
  );
}

/* ---------- Stoavia: the mall's AI assistant (Claude via the page's `sample` capability) ---------- */

const StoaviaCtx = React.createContext({ status: "off", askJson: null });
const useStoavia = () => React.useContext(StoaviaCtx);
const OFF_CODES = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];

function atriumMessage(e) {
  const c = e && e.code;
  if (OFF_CODES.includes(c)) return "Stoavia isn't available here. It runs when this page is open in Claude and you allow it to ask Claude.";
  if (c === "rate_limited") return "Stoavia is busy right now. Give it a minute and try again.";
  if (c === "session_expired") return "Sign in to Claude again to use Stoavia.";
  if (c === "refused") return "Stoavia can't help with that one. Try asking another way.";
  if (c === "prompt_too_large") return "That's too much at once. Try something shorter.";
  return "Stoavia lost its train of thought. Try again.";
}

function StoaviaProvider({ children }) {
  const [status, setStatus] = useState("loading");
  const fnRef = useRef(null);
  useEffect(() => {
    let live = true;
    (async () => {
      try {
        const c = window.claude;
        if (!c || typeof c.use !== "function") { live && setStatus("off"); return; }
        const s = await c.use("sample");
        if (!live) return;
        if (!s) { setStatus("off"); return; }
        fnRef.current = s;
        setStatus("ready");
      } catch (e) { live && setStatus("off"); }
    })();
    return () => { live = false; };
  }, []);
  const askJson = async (input, opts) => {
    const s = fnRef.current;
    if (!s) throw { code: "not_granted", message: "sample unavailable" };
    try { return await s.json(input, opts); }
    catch (e) { if (e && OFF_CODES.includes(e.code)) setStatus("off"); throw e; }
  };
  return <StoaviaCtx.Provider value={{ status, askJson }}>{children}</StoaviaCtx.Provider>;
}

function StoaviaMark({ size = 28 }) {
  return (
    <span aria-hidden="true" className="flex items-center justify-center rounded-lg flex-none" style={{ width: size, height: size, background: "var(--accent-strong)" }}>
      <svg viewBox="0 0 24 24" width={size * 0.64} height={size * 0.64} fill="none" stroke="#FFFFFF" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M4 21V11a8 8 0 0 1 16 0v10" /><path d="M9 21v-6a3 3 0 0 1 6 0v6" /><path d="M2.5 21h19" /><path d="M12 3v2.5" />
      </svg>
    </span>
  );
}

function Thinking({ label }) {
  return <span className="inline-flex items-center gap-2"><span className="dots" aria-hidden="true"><span /><span /><span /></span><span>{label}</span></span>;
}

function wingOf(s) {
  if (s.id === "mine") return "New tenants";
  const L = LEVELS[s.level];
  const i = L ? L.shops.indexOf(s.id) : -1;
  return L ? (i < 2 ? L.wings[0][0] : L.wings[1][0]) : "";
}

function catalogText(shops) {
  return shops.map((s) =>
    s.id + " | " + s.name + " (" + s.handle + ") | Level " + s.level + ", " + wingOf(s) + ", " + s.unit + " | " + s.niche + " | code " + s.code + "\n" +
    s.products.map((p) => "  - " + p.name + " | " + p.type + " | " + priceLabel(p.price) + " | " + p.desc).join("\n")
  ).join("\n");
}

const ATRIUM_RULES = [
  "You are Stoavia, the concierge of Shelfspace Global, a digital mall where each creator runs their own themed shop.",
  "Help the visitor find products and shops, compare items, suggest gifts, and explain how Shelfspace Global works.",
  "Facts: visitors never need an account; each shop has a discount code the visitor copies; checkout happens wherever the listing lives, and Shelfspace Global never runs checkout. Level 1 is Beauty & Outdoor, Level 2 is Fitness & Home, with escalators between them.",
  "Only recommend products that are in the catalog below, with their exact names; never invent products, prices or codes. Prices are in South African rand (R).",
  "Keep the reply under 70 words, warm and plain. No markdown.",
  "Reply with only JSON in this shape:",
  '{"reply": "text", "products": [{"shop": "shop id", "name": "exact product name"}], "go": "shop id or null", "followups": ["short question", "short question"]}',
  "products: 0 to 4 items that answer the question. go: one shop to walk the visitor to when one clearly fits, else null. followups: up to 3 short things the visitor might ask next."
].join("\n");

function StoaviaPanel({ open, onClose, shops, mallApi, pending, clearPending }) {
  const atrium = useStoavia();
  const [msgs, setMsgs] = useState([]);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const ctlRef = useRef(null), inputRef = useRef(null), endRef = useRef(null);
  const byId = useMemo(() => { const m = {}; shops.forEach((s) => (m[s.id] = s)); return m; }, [shops]);

  useEffect(() => { if (open) setTimeout(() => inputRef.current && inputRef.current.focus(), 60); }, [open]);
  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ block: "end" }); }, [msgs, busy]);
  useEffect(() => {
    if (!open) return;
    const k = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, [open]);

  const send = async (raw) => {
    const q = (raw || "").trim();
    if (!q || busy) return;
    if (atrium.status !== "ready") {
      setMsgs((m) => [...m, { role: "user", text: q }, { role: "atrium", text: atriumMessage({ code: atrium.status === "loading" ? "upstream_error" : "not_granted" }), error: true }]);
      setText("");
      return;
    }
    const history = msgs.filter((m) => !m.error).slice(-8);
    const where = mallApi.current && mallApi.current.where ? mallApi.current.where() : null;
    const rules = ATRIUM_RULES + "\n\nCatalog (shop id | name | location | category | code, then products as name | type | price | description):\n" + catalogText(shops) +
      "\n\nWhere the visitor is right now: " + (where ? where : "reading the page below the mall") + ".";
    const turns = [{ role: "user", content: rules }];
    history.forEach((m) => turns.push(m.role === "user" ? { role: "user", content: m.text } : { role: "assistant", content: m.raw }));
    turns.push({ role: "user", content: q });
    setMsgs((m) => [...m, { role: "user", text: q }]);
    setText("");
    setBusy(true);
    const ctl = new AbortController();
    ctlRef.current = ctl;
    try {
      const r = await atrium.askJson(turns, { modelTier: "quick", cache: false, signal: ctl.signal });
      const reply = r && typeof r.reply === "string" && r.reply.trim() ? r.reply.trim() : "Here's what I found.";
      const products = (r && Array.isArray(r.products) ? r.products : []).map((p) => {
        const s = p && byId[String(p.shop)];
        const prod = s && s.products.find((x) => x.name === String(p.name));
        return prod ? { shop: s, product: prod } : null;
      }).filter(Boolean).slice(0, 4);
      const go = r && r.go && byId[String(r.go)] ? byId[String(r.go)] : null;
      const followups = (r && Array.isArray(r.followups) ? r.followups : []).filter((x) => typeof x === "string" && x.trim()).slice(0, 3);
      const rawOut = JSON.stringify({ reply, products: products.map((x) => ({ shop: x.shop.id, name: x.product.name })), go: go ? go.id : null });
      setMsgs((m) => [...m, { role: "atrium", text: reply, products, go, followups, raw: rawOut }]);
    } catch (e) {
      setMsgs((m) => [...m, { role: "atrium", text: e && e.code === "cancelled" ? "Stopped." : atriumMessage(e), error: true }]);
    } finally {
      setBusy(false);
    }
  };

  useEffect(() => { if (open && pending) { send(pending); clearPending(); } }, [open, pending]);

  const goTo = (shop, productName) => {
    mallApi.current && mallApi.current.visit(shop.id, productName);
    if (window.innerWidth < 768) onClose();
  };

  if (!open) return null;
  const starters = ["A gift under R300 for a skincare fan", "What do I need for a first camping trip?", "Which shops sell digital downloads?", "How does checkout work here?"];

  return (
    <div role="dialog" aria-label="Stoavia, the mall concierge"
      className="fixed z-[75] inset-x-0 bottom-0 h-[86svh] rounded-t-2xl md:inset-x-auto md:right-0 md:top-0 md:h-full md:w-[420px] md:rounded-none flex flex-col bg-bg text-ink border border-line shadow-[0_0_60px_-20px_var(--shadow)]">
      <div className="flex items-center gap-3 px-4 py-3 border-b border-line" style={{ paddingTop: "max(12px, env(safe-area-inset-top, 0px))" }}>
        <StoaviaMark size={34} />
        <div className="flex-1 min-w-0">
          <div className="font-display font-extrabold uppercase text-[1.2rem] leading-none">Stoavia</div>
          <div className="text-[0.8rem] text-inkmuted">Mall concierge · knows every shop and shelf</div>
        </div>
        <button type="button" onClick={onClose} className="min-h-[40px] px-3.5 rounded-full border border-line bg-surface text-[0.85rem] font-medium">Close</button>
      </div>

      <div className="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-3" aria-live="polite">
        <div className="rounded-2xl rounded-tl-sm bg-surface border border-line px-4 py-3 text-[0.94rem] leading-relaxed max-w-[92%]">
          Hi, I&rsquo;m Stoavia. Tell me what you&rsquo;re after, or who it&rsquo;s for, and I&rsquo;ll find it across every shop and walk you there.
        </div>
        {msgs.length === 0 && (
          <div className="flex flex-wrap gap-2">
            {starters.map((s) => (
              <button key={s} type="button" onClick={() => send(s)} className="text-left text-[0.84rem] min-h-[40px] px-3.5 py-2 rounded-full border border-line bg-bg hover:bg-surface transition-colors">{s}</button>
            ))}
          </div>
        )}
        {msgs.map((m, i) => m.role === "user" ? (
          <div key={i} className="self-end max-w-[85%] rounded-2xl rounded-tr-sm bg-chipbg text-chipink px-4 py-2.5 text-[0.94rem]">{m.text}</div>
        ) : (
          <div key={i} className="max-w-[94%] flex flex-col gap-2">
            <div className={"rounded-2xl rounded-tl-sm border px-4 py-3 text-[0.94rem] leading-relaxed " + (m.error ? "border-dashed border-line text-inkmuted" : "bg-surface border-line")}>{m.text}</div>
            {m.products && m.products.length > 0 && (
              <ul className="grid grid-cols-2 gap-2 list-none p-0 m-0">
                {m.products.map(({ shop, product }) => (
                  <li key={shop.id + product.name} className="rounded-xl p-2.5 flex flex-col gap-1.5 min-w-0" style={{ ...shop.vars, background: "var(--p-bg)", color: "var(--p-ink)", border: "1px solid var(--p-line)" }}>
                    <div className="flex items-center gap-2 min-w-0">
                      <ProductArt kind={product.kind} size={34} />
                      <span className="text-[0.72rem] truncate" style={{ fontFamily: shop.font, fontWeight: shop.weight, color: "var(--p-accent)" }}>{shop.name}</span>
                    </div>
                    <span className="text-[0.82rem] leading-snug">{product.name}</span>
                    <span className="flex items-center justify-between gap-1 mt-auto">
                      <span className="font-mono text-[0.8rem] font-bold" style={{ color: "var(--p-accent)" }}>{priceLabel(product.price)}</span>
                      <button type="button" onClick={() => goTo(shop, product.name)} className="text-[0.76rem] font-semibold min-h-[32px] px-2.5 rounded-full" style={{ background: "var(--p-accent)", color: "var(--p-bg)" }}>See it</button>
                    </span>
                  </li>
                ))}
              </ul>
            )}
            {m.go && (
              <button type="button" onClick={() => goTo(m.go)} className="self-start inline-flex items-center gap-2 min-h-[40px] px-3.5 rounded-full text-[0.85rem] font-semibold"
                style={{ ...m.go.vars, background: "var(--p-bg)", color: "var(--p-accent)", border: "1px solid var(--p-accent)" }}>
                Walk me to {m.go.name} →
              </button>
            )}
            {m.followups && m.followups.length > 0 && i === msgs.length - 1 && (
              <div className="flex flex-wrap gap-1.5">
                {m.followups.map((f) => (
                  <button key={f} type="button" onClick={() => send(f)} className="text-left text-[0.8rem] min-h-[36px] px-3 py-1.5 rounded-full border border-line hover:bg-surface transition-colors">{f}</button>
                ))}
              </div>
            )}
          </div>
        ))}
        {busy && <div className="text-[0.88rem] text-inkmuted px-1"><Thinking label="Stoavia is looking through the shelves" /></div>}
        <div ref={endRef} />
      </div>

      <form onSubmit={(e) => { e.preventDefault(); send(text); }} className="border-t border-line p-3 flex gap-2 items-center" style={{ paddingBottom: "max(12px, env(safe-area-inset-bottom, 0px))" }}>
        <label htmlFor="atrium-input" className="sr-only">Ask Stoavia</label>
        <input id="atrium-input" ref={inputRef} value={text} onChange={(e) => setText(e.target.value)} autoComplete="off" maxLength={400}
          placeholder="Ask about shops, gifts, prices…" className="flex-1 min-w-0 min-h-[46px] rounded-full border border-line bg-surface text-ink px-4 text-[0.98rem]" />
        {busy
          ? <Button variant="outline" onClick={() => ctlRef.current && ctlRef.current.abort()}>Stop</Button>
          : <button type="submit" disabled={!text.trim()} className="min-h-[46px] px-4 rounded-full bg-accentstrong text-accentink font-bold text-[0.9rem] disabled:opacity-40">Ask</button>}
      </form>
    </div>
  );
}

/* merchandising: Stoavia reviews one shelf and suggests an order, a hero item, tips and a bundle */
function MerchAdvisor({ shop, neighbors = [], onApply, applied }) {
  const atrium = useStoavia();
  const [st, setSt] = useState({ status: "idle" });
  const ctlRef = useRef(null);
  useEffect(() => { setSt({ status: "idle" }); return () => { ctlRef.current && ctlRef.current.abort(); }; }, [shop.id]);
  if (atrium.status === "off") return null;

  const run = async (fresh) => {
    const ctl = new AbortController();
    ctlRef.current = ctl;
    setSt({ status: "loading" });
    const others = neighbors.filter((n) => n.id !== shop.id).map((n) => n.name + " (" + n.niche + ")").join(", ") || "none";
    const prompt = [
      "You are Stoavia, the merchandising assistant in Shelfspace Global, a digital mall where creators run their own themed shops.",
      "Review this creator's shelf and suggest how to merchandise it. Be concrete and practical, and talk to the creator directly.",
      "",
      "Shop: " + shop.name + " (" + shop.handle + "), " + shop.niche + ". Tagline: \"" + shop.tagline + "\". Shelf layout: " + shop.layout + ". Location: Level " + shop.level + ", " + wingOf(shop) + ".",
      "Products in the current shelf order (prices in South African rand; the first three also fill the storefront window in the mall):",
      shop.products.map((p, i) => (i + 1) + ". " + p.name + " | " + p.type + " | " + priceLabel(p.price) + " | " + p.desc).join("\n"),
      "Neighbouring shops on the same floor: " + others + ".",
      "",
      "Reply with only JSON in this shape:",
      '{"headline": "one sentence, max 90 characters", "hero": "exact product name to feature first", "order": ["every product name exactly as written, best first"], "why_order": "max 160 characters", "tips": [{"title": "max 40 characters", "detail": "max 160 characters"}], "bundle": {"name": "max 40 characters", "items": ["2 or 3 exact product names"], "price": 0, "pitch": "max 120 characters"}}',
      "Give exactly 3 tips. The bundle price is a whole number in rand, below the items' combined price; use null for bundle if no bundle makes sense."
    ].join("\n");
    try {
      const r = await atrium.askJson(prompt, { modelTier: "default", signal: ctl.signal, cache: fresh ? { gcTime: 600000, refresh: true } : { gcTime: 600000 } });
      const names = shop.products.map((p) => p.name);
      let order = (r && Array.isArray(r.order) ? r.order.map(String) : []).filter((n, i, a) => names.includes(n) && a.indexOf(n) === i);
      names.forEach((n) => { if (!order.includes(n)) order.push(n); });
      const hero = r && names.includes(String(r.hero)) ? String(r.hero) : order[0];
      order = [hero, ...order.filter((n) => n !== hero)];
      const tips = (r && Array.isArray(r.tips) ? r.tips : []).filter((t) => t && t.title && t.detail).slice(0, 3).map((t) => ({ title: String(t.title).slice(0, 60), detail: String(t.detail).slice(0, 220) }));
      let bundle = r && r.bundle && Array.isArray(r.bundle.items) ? r.bundle : null;
      if (bundle) {
        const items = bundle.items.map(String).filter((n) => names.includes(n));
        bundle = items.length >= 2 ? { name: String(bundle.name || "Bundle").slice(0, 50), items, price: Number.isFinite(Number(bundle.price)) ? Math.round(Number(bundle.price)) : null, pitch: String(bundle.pitch || "").slice(0, 160) } : null;
      }
      setSt({ status: "done", headline: String((r && r.headline) || "Here's how I'd set up this shelf.").slice(0, 120), order, hero, why: String((r && r.why_order) || "").slice(0, 220), tips, bundle });
    } catch (e) {
      if (e && e.code === "cancelled") setSt({ status: "idle" });
      else setSt({ status: "error", message: atriumMessage(e) });
    }
  };

  const box = { background: "var(--p-surface)", border: "1px solid var(--p-line)" };
  return (
    <section aria-label="Stoavia merchandising" className="mt-8 rounded-2xl p-4 md:p-5" style={box}>
      <div className="flex items-start gap-3 flex-wrap">
        <StoaviaMark size={30} />
        <div className="flex-1 min-w-[200px]">
          <div className="font-bold text-[1rem]">Stoavia merchandising</div>
          <div className="text-[0.84rem]" style={{ color: "var(--p-inkmuted)" }}>For the shop owner. Stoavia reviews this shelf and suggests an order, a hero item, a bundle and three quick wins.</div>
        </div>
        {st.status === "idle" && <button type="button" onClick={() => run(false)} className="min-h-[44px] px-4 rounded-full font-bold text-[0.88rem]" style={{ background: "var(--p-accent)", color: "var(--p-bg)" }}>Get suggestions</button>}
        {st.status === "loading" && <button type="button" onClick={() => ctlRef.current && ctlRef.current.abort()} className="min-h-[44px] px-4 rounded-full text-[0.88rem] font-medium" style={{ border: "1px solid var(--p-line)" }}>Stop</button>}
      </div>

      {st.status === "loading" && <p className="mt-4 text-[0.9rem]" style={{ color: "var(--p-inkmuted)" }} aria-live="polite"><Thinking label="Stoavia is walking the shelf. This can take up to a minute." /></p>}
      {st.status === "error" && (
        <div className="mt-4 flex items-center gap-3 flex-wrap" aria-live="polite">
          <p className="text-[0.9rem] m-0" style={{ color: "var(--p-inkmuted)" }}>{st.message}</p>
          <button type="button" onClick={() => run(true)} className="min-h-[40px] px-3.5 rounded-full text-[0.85rem] font-medium" style={{ border: "1px solid var(--p-line)" }}>Try again</button>
        </div>
      )}
      {st.status === "done" && (
        <div className="mt-4" aria-live="polite">
          <p className="text-[1.15rem] leading-snug m-0" style={{ fontFamily: shop.font, fontWeight: shop.weight }}>{st.headline}</p>
          <div className="mt-4 grid md:grid-cols-2 gap-4">
            <div className="min-w-0">
              <div className="font-mono text-[0.72rem] font-bold tracking-wider uppercase" style={{ color: "var(--p-inkmuted)" }}>Suggested shelf order</div>
              <ol className="mt-2 flex flex-col gap-1.5 p-0 m-0 list-none">
                {st.order.map((n, i) => (
                  <li key={n} className="flex items-center gap-2 text-[0.9rem]">
                    <span className="font-mono text-[0.75rem] w-6 flex-none" style={{ color: "var(--p-inkmuted)" }}>{String(i + 1).padStart(2, "0")}</span>
                    <span className="min-w-0">{n}</span>
                    {n === st.hero && <span className="font-mono text-[0.66rem] font-bold px-1.5 py-0.5 rounded flex-none" style={{ background: "var(--p-accent)", color: "var(--p-bg)" }}>HERO</span>}
                    {i < 3 && n !== st.hero && <span className="font-mono text-[0.66rem] px-1.5 py-0.5 rounded flex-none" style={{ border: "1px solid var(--p-line)", color: "var(--p-inkmuted)" }}>WINDOW</span>}
                  </li>
                ))}
              </ol>
              {st.why && <p className="text-[0.84rem] mt-2 leading-relaxed" style={{ color: "var(--p-inkmuted)" }}>{st.why}</p>}
              {st.bundle && (
                <div className="mt-3 rounded-xl p-3" style={{ background: "var(--p-bg)", border: "1px dashed var(--p-accent)" }}>
                  <div className="flex justify-between items-baseline gap-2">
                    <span className="font-bold text-[0.95rem]">{st.bundle.name}</span>
                    {st.bundle.price !== null && <span className="font-mono font-bold text-[0.95rem]" style={{ color: "var(--p-accent)" }}>R{st.bundle.price.toLocaleString("en-ZA")}</span>}
                  </div>
                  <div className="text-[0.82rem] mt-1" style={{ color: "var(--p-inkmuted)" }}>{st.bundle.items.join(" + ")}</div>
                  {st.bundle.pitch && <div className="text-[0.85rem] mt-1.5">{st.bundle.pitch}</div>}

            <ul className="flex flex-col gap-2.5 list-none p-0 m-0 min-w-0">
              {st.tips.map((t) => (

                </li>
              ))}

          </div>
          <div className="mt-4 flex flex-wrap gap-2 items-center">

            {onApply && applied && (
              <>
                <span className="text-[0.88rem] font-semibold">Applied to the shelf and the storefront window.</span>

/* store building: Stoavia turns a one-line description into a full shop design */
const PRODUCT_TYPES = ["Physical", "Digital", "App", "Shopify"];
const ART_KINDS = ["bottle", "jar", "box", "doc", "app", "bag", "pan", "band", "store"];

function StoaviaBuilder({ cfg, onDesign }) {
  const atrium = useStoavia();
  const [brief, setBrief] = useState("");
  const [st, setSt] = useState({ status: "idle" });
  const ctlRef = useRef(null);
  if (atrium.status === "off") {
    return <p className="text-[0.84rem] text-inkmuted m-0 rounded-xl border border-dashed border-line p-3">Stoavia can design this shop for you when the page is open in Claude.</p>;
  }
  const run = async () => {
    const b = brief.trim();
    if (!b) return;
    const ctl = new AbortController();
    ctlRef.current = ctl;
    setSt({ status: "loading" });
    const prompt = [
      "You are Stoavia, the shop designer in Shelfspace Global, a digital mall where each creator gets a themed shop.",
      "Design a shop for this creator from their description. Make it feel like their channel, not a generic store.",
      "",
      "Creator's description: \"\"\"" + b.slice(0, 1200) + "\"\"\"",
      "",
      "Choose from these options only:",
      "niche: " + Object.keys(NICHES).join(", "),
      "palette: " + PALETTES.map((p) => p.id + " (" + p.name + ", background " + p.vars["--p-bg"] + ", text " + p.vars["--p-ink"] + ")").join("; "),
      "font: fraunces (soft editorial serif), cormorant (elegant high-contrast serif), dmserif (bold fashion serif), bebas (tall condensed caps, rugged), anton (heavy condensed, gym poster), fredoka (rounded and friendly), syne (quirky modern geometric), josefin (clean vintage geometric sans)",
      "layout: boutique (one glass shelf, centred, for few premium items), basecamp (a hero item plus a list, for gear), studio (big rounded cards, playful), pantry (numbered labelled shelves, for collections)",
      "product type: Physical, Digital, App, Shopify. product kind (the drawing used): bottle, jar, box, doc, app, bag, pan, band, store",
      "",
      "Reply with only JSON in this shape:",
      '{"name": "max 20 characters", "handle": "@handle, max 24 characters", "niche": "", "tagline": "max 56 characters", "palette": "", "accent": "#RRGGBB", "font": "", "layout": "", "products": [{"type": "", "kind": "", "name": "max 40 characters", "price": 0, "desc": "max 120 characters"}], "why": "one or two sentences on the choices"}',
      "Give exactly 4 products that fit what this creator would really sell. Prices are whole numbers in South African rand (0 for free apps). The accent must be easy to read on the palette's background."
    ].join("\n");
    try {
      const r = await atrium.askJson(prompt, { modelTier: "default", cache: false, signal: ctl.signal });
      const pick = (v, list, fallback) => (list.includes(String(v)) ? String(v) : fallback);
      const products = (r && Array.isArray(r.products) ? r.products : []).slice(0, 4).map((p) => {
        const type = pick(p && p.type, PRODUCT_TYPES, "Physical");
        const n = Number(p && p.price);
        return {
          type, kind: pick(p && p.kind, ART_KINDS, "box"),
          name: String((p && p.name) || "Untitled product").slice(0, 44),
          price: type === "Shopify" ? null : Number.isFinite(n) ? Math.max(0, Math.round(n)) : 0,
          desc: String((p && p.desc) || SAMPLE_DESC).slice(0, 140)
        };
      });
      const next = {
        ...cfg,
        name: String((r && r.name) || cfg.name).slice(0, 20),
        handle: String((r && r.handle) || cfg.handle).slice(0, 24),
        niche: pick(r && r.niche, Object.keys(NICHES), cfg.niche),
        tagline: String((r && r.tagline) || cfg.tagline).slice(0, 56),
        palette: pick(r && r.palette, PALETTES.map((p) => p.id), cfg.palette),
        accent: /^#[0-9a-f]{6}$/i.test(String(r && r.accent)) ? String(r.accent) : cfg.accent,
        font: pick(r && r.font, FONTS.map((f) => f.id), cfg.font),
        layout: pick(r && r.layout, LAYOUTS.map((l) => l.id), cfg.layout),
        products: products.length === 4 ? products : undefined
      };
      onDesign(next, cfg);
      setSt({ status: "done", why: String((r && r.why) || "").slice(0, 300), prev: cfg });
    } catch (e) {
      if (e && e.code === "cancelled") setSt({ status: "idle" });
      else setSt({ status: "error", message: atriumMessage(e) });
    }
  };
  return (
    <div className="rounded-xl border border-line bg-bg p-4">
      <div className="flex items-center gap-2.5">
        <StoaviaMark size={28} />
        <div>
          <div className="font-bold text-[0.95rem] leading-tight">Design it with Stoavia</div>
          <div className="text-[0.8rem] text-inkmuted">Describe your channel. Stoavia picks the look, layout and four starter products.</div>
        </div>
      </div>
      <label htmlFor="b-brief" className="sr-only">Describe your channel</label>
      <textarea id="b-brief" rows={3} value={brief} onChange={(e) => setBrief(e.target.value)} maxLength={1200}
        placeholder="e.g. I review budget espresso gear and home barista setups on YouTube. Calm, nerdy, a bit retro."
        className="mt-3 w-full rounded-lg border border-line bg-surface text-ink px-3 py-2.5 text-[0.95rem] leading-relaxed resize-y" />
      <div className="mt-2 flex flex-wrap items-center gap-2">
        {st.status === "loading"
          ? <>
              <span className="text-[0.88rem] text-inkmuted" aria-live="polite"><Thinking label="Stoavia is designing your shop. This can take up to a minute." /></span>
              <Button variant="outline" onClick={() => ctlRef.current && ctlRef.current.abort()}>Stop</Button>
            </>
          : <button type="button" onClick={run} disabled={!brief.trim()} className="min-h-[44px] px-4 rounded-full bg-accentstrong text-accentink font-bold text-[0.88rem] disabled:opacity-40">
              {st.status === "done" ? "Design it again" : "Design my shop"}
            </button>}
        {st.status === "done" && st.prev && <button type="button" onClick={() => { onDesign(st.prev); setSt({ status: "idle" }); }} className="min-h-[44px] text-[0.85rem] text-inkmuted underline underline-offset-4">Undo</button>}
      </div>
      {st.status === "done" && st.why && <p className="text-[0.85rem] mt-2 m-0 leading-relaxed" aria-live="polite"><span className="font-semibold">Stoavia:</span> {st.why}</p>}
      {st.status === "error" && <p className="text-[0.85rem] mt-2 m-0 text-inkmuted" aria-live="polite">{st.message}</p>}
    </div>
  );
}

const STORE_KEY = "shelfspace.myshop.v1";
function loadCfg() {
  try { const raw = localStorage.getItem(STORE_KEY); return raw ? { ...DEFAULT_CFG, ...JSON.parse(raw) } : null; } catch (e) { return null; }
}
function saveCfg(cfg) { try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch (e) {} }
function clearCfg() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

function hexLum(hex) {
  const h = (hex || "#000000").replace("#", "");
  const c = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255).map((v) => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
const contrast = (a, b) => { const x = hexLum(a), y = hexLum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };

/* ---------- mall pieces ---------- */

const clamp01 = (v) => Math.min(1, Math.max(0, v));
const smooth = (a, b, p) => { const t = clamp01((p - a) / (b - a)); return t * t * (3 - 2 * t); };
/* camera depth over scroll progress: approach the doors, pass through, walk the concourse, stop at the shop */
const CAMERA = [[0, -420], [0.2, 180], [0.33, 1150], [0.8, 3260], [0.9, 3560], [1, 3560]];
function cameraAt(p) {
  for (let i = 1; i < CAMERA.length; i++) {
    const [p0, z0] = CAMERA[i - 1], [p1, z1] = CAMERA[i];
    if (p <= p1) return z0 + (z1 - z0) * smooth(p0, p1, p);
  }
  return CAMERA[CAMERA.length - 1][1];
}
const place = (w, h, transform, extra) => ({ width: w, height: h, marginLeft: -w / 2, marginTop: -h / 2, transform, ...extra });

/* ---------- shop interior ---------- */

function ProductDetail({ shop, product, onClose }) {
  const closeRef = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    closeRef.current && closeRef.current.focus();
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => { window.removeEventListener("keydown", onKey); try { prev && prev.focus({ preventScroll: true }); } catch (e) {} };
  }, []);
  return (
    <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-6" style={{ background: "var(--scrim)" }} onClick={onClose}>
      <div role="dialog" aria-modal="true" aria-labelledby="pd-title" onClick={(e) => e.stopPropagation()}
        className="w-full sm:max-w-[520px] rounded-t-2xl sm:rounded-2xl p-6 max-h-[88svh] overflow-y-auto"
        style={{ ...shop.vars, background: "var(--p-surface)", color: "var(--p-ink)", border: "1px solid var(--p-line)" }}>
        <div className="flex justify-between items-start gap-4">
          <span className="font-mono text-[0.72rem] font-bold tracking-wider uppercase" style={{ color: "var(--p-inkmuted)" }}>{shop.name} · {product.type}</span>
          <button ref={closeRef} type="button" onClick={onClose} className="min-h-[40px] px-3 rounded-full text-[0.85rem] font-medium" style={{ border: "1px solid var(--p-line)" }}>Close</button>
        </div>
        <div className="flex justify-center py-6 rounded-xl mt-3" style={{ background: "var(--p-bg)" }}><ProductArt kind={product.kind} size={140} /></div>
        <h3 id="pd-title" className="mt-4 text-[1.6rem] leading-tight" style={{ fontFamily: shop.font, fontWeight: shop.weight }}>{product.name}</h3>
        <p className="mt-2 text-[0.95rem] leading-relaxed" style={{ color: "var(--p-inkmuted)" }}>{product.desc}</p>
        <div className="mt-4 flex items-center justify-between gap-3 flex-wrap">
          <span className="font-mono text-[1.2rem] font-bold" style={{ color: "var(--p-accent)" }}>{priceLabel(product.price)}</span>
          <CodeChip code={shop.code} item={product.name}
            className="font-mono text-[0.85rem] font-semibold min-h-[44px] px-4 rounded-full tracking-wide whitespace-nowrap transition-opacity hover:opacity-85"
            style={{ background: "var(--p-accent)", color: "var(--p-bg)" }} />
        </div>
        <p className="mt-4 text-[0.82rem] leading-relaxed" style={{ color: "var(--p-inkmuted)" }}>
          Copy {shop.handle}&rsquo;s code, then check out wherever this listing lives. Shelfspace Global shows you the shelf; it never runs the checkout.
        </p>
      </div>
    </div>
  );
}

/* ---------- follow a shop: opt-in, no account ---------- */

const FOLLOW_KEY = "shelfspace.follows.v1";
function loadFollows() { try { return JSON.parse(localStorage.getItem(FOLLOW_KEY) || "{}") || {}; } catch (e) { return {}; } }
function saveFollows(f) { try { localStorage.setItem(FOLLOW_KEY, JSON.stringify(f)); } catch (e) {} }

function FollowShop({ shop, centered, framed }) {
  const [follows, setFollows] = useState(loadFollows);
  const [open, setOpen] = useState(false);
  const [contact, setContact] = useState("");
  const [share, setShare] = useState(false);
  const [err, setErr] = useState("");
  const mine = follows[shop.id];
  const uid = "follow-" + shop.id + (framed ? "-f" : "");
  const update = (next) => { setFollows(next); saveFollows(next); };
  const submit = (e) => {
    e.preventDefault();
    const v = contact.trim();
    if (!(/^\S+@\S+\.\S+$/.test(v) || v.replace(/\D/g, "").length >= 9)) { setErr("Enter an email address or a WhatsApp number."); return; }
    /* the contact itself is never kept in this preview, only the choice */
    update({ ...follows, [shop.id]: { share } });
    setOpen(false); setContact(""); setErr("");
  };
  const unfollow = () => { const next = { ...follows }; delete next[shop.id]; update(next); };
  const btn = "inline-flex items-center gap-2 min-h-[44px] px-4 rounded-full text-[0.88rem] font-bold transition-opacity hover:opacity-85";
  return (
    <div className={"mt-3 " + (centered ? "text-center" : "")}>
      {mine ? (
        <p className="m-0 text-[0.88rem]" aria-live="polite">
          <span className="font-bold">✓ Following {shop.name}.</span>{" "}
          <span style={{ color: "var(--p-inkmuted)" }}>{mine.share ? "The owner can contact you directly." : "Updates reach you through Shelfspace Global. The owner never sees your details."}</span>{" "}
          <button type="button" onClick={unfollow} className="underline underline-offset-4 min-h-[44px]" style={{ color: "var(--p-ink)" }}>Unfollow</button>
        </p>
      ) : !open ? (
        <button type="button" onClick={() => setOpen(true)} className={btn} style={{ background: "transparent", color: "var(--p-ink)", border: "1.5px solid var(--p-accent)" }}>
          <span aria-hidden="true">+</span> Follow this shop
        </button>
      ) : (
        <form onSubmit={submit} className={"rounded-2xl p-4 max-w-[520px] text-left " + (centered ? "mx-auto" : "")} style={{ background: "var(--p-surface)", border: "1px solid var(--p-line)" }}>
          <label htmlFor={uid} className="block text-[0.9rem] font-bold mb-1.5">Get updates from {shop.name}</label>
          <input id={uid} type="text" inputMode="email" autoComplete="off" value={contact} onChange={(e) => { setContact(e.target.value); setErr(""); }}
            placeholder="Email or WhatsApp number" aria-describedby={uid + "-h"}
            className="w-full min-h-[44px] rounded-lg px-3 text-[0.95rem] outline-none focus-visible:ring-2"
            style={{ background: "var(--p-bg)", color: "var(--p-ink)", border: "1px solid var(--p-line)", "--tw-ring-color": "var(--p-accent)" }} />
          {err && <p className="text-[0.82rem] mt-1.5 m-0 font-semibold" role="alert">{err}</p>}
          <label className="flex items-start gap-2.5 mt-3 text-[0.86rem] cursor-pointer">
            <input type="checkbox" checked={share} onChange={(e) => setShare(e.target.checked)} className="mt-1 w-4 h-4 flex-none" />
            <span>Also share my contact details with the owner of {shop.name}</span>
          </label>
          <p id={uid + "-h"} className="text-[0.78rem] mt-2 mb-0" style={{ color: "var(--p-inkmuted)" }}>
            No account or password. Leave the box unticked and updates come through Shelfspace Global, so the owner never sees your details. Unfollow any time. This is a preview: your details are not sent or stored.
          </p>
          <div className="flex flex-wrap gap-2 mt-3">
            <button type="submit" className={btn} style={{ background: "var(--p-accent)", color: "var(--p-bg)" }}>Follow</button>
            <button type="button" onClick={() => { setOpen(false); setErr(""); }} className={btn} style={{ background: "transparent", color: "var(--p-ink)", border: "1px solid var(--p-line)" }}>Cancel</button>
          </div>
        </form>
      )}
    </div>
  );
}

function ShopInterior({ shop, neighbors = [], onPick, onBack, framed, onApplyOrder, applied, openRequest, onAskStoavia }) {
  const atrium = useStoavia();
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(null);
  useEffect(() => { setQ(""); setOpen(null); }, [shop.id, shop.layout, shop.name]);
  useEffect(() => {
    if (!openRequest || openRequest.shopId !== shop.id) return;
    const p = shop.products.find((x) => x.name === openRequest.name);
    if (p) setOpen(p);
  }, [openRequest]);
  const clean = q.toLowerCase().replace(/,/g, "");
  const words = clean.split(/\s+/).filter((w) => w.length > 2 && !["the", "and", "for", "with", "show", "any", "some", "under", "below", "less", "than"].includes(w) && !/^r?\d+$/.test(w));
  const under = clean.match(/(?:under|below|less than)\s*r?\s*(\d{2,5})/);
  const items = shop.products.filter((p) => {
    const hay = (p.name + " " + p.type + " " + p.desc).toLowerCase();
    if (under && (p.price === null || p.price >= parseInt(under[1], 10))) return false;
    return words.every((w) => hay.includes(w) || hay.includes(w.replace(/s$/, "")));
  });
  const note = q.trim() === ""
    ? "Tap anything for details. Ask for a type, a word, or a price like “under 300”."
    : items.length ? "Showing " + items.length + " of " + shop.products.length + "." : "Nothing matches that here. Try another word or a higher price.";

  const L = shop.layout || "studio";
  const pick = (p) => setOpen(p);
  const chip = (p) => (
    <CodeChip code={shop.code} item={p.name}
      className="font-mono text-[0.74rem] font-semibold min-h-[36px] px-2.5 rounded-lg tracking-wide whitespace-nowrap transition-opacity hover:opacity-85 active:scale-95"
      style={{ background: "var(--p-accent)", color: "var(--p-bg)" }} />
  );
  const price = (p, cls = "") => <span className={"font-mono text-[0.9rem] font-bold " + cls} style={{ color: "var(--p-accent)" }}>{priceLabel(p.price)}</span>;
  const surface = { background: "var(--p-surface)", border: "1px solid var(--p-line)" };

  let shelf;
  if (items.length === 0) {
    shelf = <p className="mt-4 text-[0.95rem]" style={{ color: "var(--p-inkmuted)" }}>This shelf is empty for that question.</p>;
  } else if (L === "boutique") {
    shelf = (
      <ul className="mt-4 grid grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-6 list-none p-0 m-0">
        {items.map((p) => (
          <li key={p.name} className="flex flex-col items-center text-center min-w-0">
            <button type="button" onClick={() => pick(p)} className="group flex flex-col items-center w-full rounded-xl pt-2 px-1" aria-label={"View " + p.name}>
              <span className="block transition-transform duration-200 group-hover:-translate-y-1.5"><ProductArt kind={p.kind} size={framed ? 72 : 88} /></span>
              <span aria-hidden="true" className="block w-full h-[6px] rounded-full mt-1" style={{ background: "var(--p-line)", boxShadow: "0 8px 14px -8px rgba(0,0,0,.55)" }} />
              <span className="mt-2.5 text-[0.9rem] leading-snug">{p.name}</span>
            </button>
            <span className="flex items-center gap-2 mt-1.5 flex-wrap justify-center">{price(p)}{chip(p)}</span>
          </li>
        ))}
      </ul>
    );
  } else if (L === "basecamp") {
    const [hero, ...rest] = items;
    shelf = (
      <div className="mt-4 grid md:grid-cols-[1.1fr_1fr] gap-3">
        <div className="rounded-xl p-4 flex gap-4 items-center min-w-0" style={surface}>
          <button type="button" onClick={() => pick(hero)} className="flex gap-4 items-center text-left min-w-0 flex-1" aria-label={"View " + hero.name}>
            <span className="rounded-lg p-2 flex-none" style={{ background: "var(--p-bg)" }}><ProductArt kind={hero.kind} size={framed ? 80 : 104} /></span>
            <span className="min-w-0">
              <span className="font-mono text-[0.7rem] font-bold tracking-wider uppercase block" style={{ color: "var(--p-inkmuted)" }}>Pick of the shelf · {hero.type}</span>
              <span className="block text-[1.25rem] leading-tight mt-1" style={{ fontFamily: shop.font, fontWeight: shop.weight }}>{hero.name}</span>
              <span className="block text-[0.85rem] mt-1 leading-snug" style={{ color: "var(--p-inkmuted)" }}>{hero.desc}</span>
            </span>
          </button>
          <span className="flex flex-col items-end gap-2 flex-none">{price(hero)}{chip(hero)}</span>
        </div>
        <ul className="flex flex-col gap-2 list-none p-0 m-0">
          {rest.map((p) => (
            <li key={p.name} className="rounded-xl px-3 py-2 flex items-center gap-3 min-w-0" style={surface}>
              <button type="button" onClick={() => pick(p)} className="flex items-center gap-3 text-left flex-1 min-w-0 min-h-[44px]" aria-label={"View " + p.name}>
                <ProductArt kind={p.kind} size={44} />
                <span className="min-w-0">
                  <span className="block text-[0.9rem] leading-snug">{p.name}</span>
                  <span className="font-mono text-[0.7rem] uppercase tracking-wider" style={{ color: "var(--p-inkmuted)" }}>{p.type}</span>
                </span>
              </button>
              {price(p, "flex-none")}
              {chip(p)}
            </li>
          ))}
        </ul>
      </div>
    );
  } else if (L === "pantry") {
    shelf = (
      <ul className="mt-4 grid grid-cols-2 md:grid-cols-4 gap-x-3 gap-y-5 list-none p-0 m-0">
        {items.map((p, i) => (
          <li key={p.name} className="flex flex-col min-w-0">
            <button type="button" onClick={() => pick(p)} className="group relative flex flex-col items-center pt-3" aria-label={"View " + p.name}>
              <span className="absolute left-0 top-0 font-mono text-[0.68rem] font-bold px-1.5 py-0.5 rounded" style={{ background: "var(--p-surface)", border: "1px solid var(--p-line)", color: "var(--p-inkmuted)" }}>No. {String(i + 1).padStart(2, "0")}</span>
              <span className="transition-transform duration-200 group-hover:-translate-y-1"><ProductArt kind={p.kind} size={framed ? 64 : 80} /></span>
            </button>
            <span aria-hidden="true" className="block h-3 rounded-sm" style={{ background: "var(--p-line)", boxShadow: "0 6px 10px -6px rgba(0,0,0,.45)" }} />
            <span className="mt-2 text-[0.88rem] leading-snug">{p.name}</span>
            <span className="flex items-center justify-between gap-2 mt-1.5 flex-wrap">{price(p)}{chip(p)}</span>
          </li>
        ))}
      </ul>
    );
  } else {
    shelf = (
      <ul className="mt-4 grid grid-cols-2 md:grid-cols-4 gap-3 list-none p-0 m-0">
        {items.map((p) => (
          <li key={p.name} className="rounded-3xl p-3.5 flex flex-col gap-2 min-w-0" style={surface}>
            <button type="button" onClick={() => pick(p)} className="group flex flex-col items-center gap-2 text-center" aria-label={"View " + p.name}>
              <span className="rounded-full p-3 transition-transform duration-200 group-hover:scale-105" style={{ background: "color-mix(in srgb, var(--p-accent) 16%, transparent)" }}><ProductArt kind={p.kind} size={framed ? 56 : 68} /></span>
              <span className="text-[0.9rem] leading-snug">{p.name}</span>
            </button>
            <span className="flex items-center justify-between gap-2 flex-wrap mt-auto">{price(p)}{chip(p)}</span>
          </li>
        ))}
      </ul>
    );
  }

  const centered = L === "boutique";
  return (
    <div style={{ ...shop.vars, background: "var(--p-bg)", color: "var(--p-ink)", position: "relative", minHeight: framed ? 0 : "100%" }} className={framed ? "rounded-2xl overflow-hidden border border-line" : ""}>
      {shop.stripes && <div aria-hidden="true" className="absolute inset-0 pointer-events-none" style={{ backgroundImage: "repeating-linear-gradient(90deg, " + shop.stripes + " 0 3px, transparent 3px 38px)" }} />}
      <div className={"relative max-w-[1100px] mx-auto px-5 " + (framed ? "py-6" : "pt-[124px] md:pt-[92px] pb-10")}>
        <div className={"flex items-center gap-3 flex-wrap " + (centered ? "justify-center text-center" : "")}>
          <div aria-hidden="true" className="w-11 h-11 rounded-full flex items-center justify-center text-[1.1rem] flex-none" style={{ background: "var(--p-accent)", color: "var(--p-bg)", fontFamily: shop.font, fontWeight: shop.weight }}>{shop.initial}</div>
          <div className={"min-w-0 " + (centered ? "" : "flex-1")}>
            <div className="text-[1.05rem] font-bold leading-tight">{shop.handle}</div>
            <div className="text-[0.84rem]" style={{ color: "var(--p-inkmuted)" }}>{shop.niche} · {shop.room}</div>
          </div>
          {!centered && <div className="font-mono text-[0.75rem] tracking-[0.12em] uppercase" style={{ color: "var(--p-inkmuted)" }}>{shop.unit} · {shop.platform} {shop.follow}</div>}
        </div>

        <FollowShop key={shop.id + (framed ? "-f" : "")} shop={shop} centered={centered} framed={framed} />

        <h2 className={"mt-4 md:mt-6 leading-[1.02] text-[clamp(1.9rem,5.2vw,3.6rem)] " + (centered ? "mx-auto text-center max-w-[18ch]" : "max-w-[20ch]")} style={{ fontFamily: shop.font, fontWeight: shop.weight, color: "var(--p-ink)" }}>{shop.tagline}</h2>

        <form role="search" onSubmit={(e) => e.preventDefault()} className={"mt-4 md:mt-6 " + (centered ? "max-w-[560px] mx-auto" : "")}>
          <label htmlFor={"ask-" + shop.id + (framed ? "-f" : "")} className="sr-only">Ask {shop.name}</label>
          <input
            id={"ask-" + shop.id + (framed ? "-f" : "")}
            type="search"
            value={q}
            onChange={(e) => setQ(e.target.value)}
            autoComplete="off"
            placeholder={"Ask " + shop.name + "… e.g. “guide” or “under 300”"}
            className="w-full min-h-[48px] rounded-full px-5 text-[1rem] outline-none focus-visible:ring-2"
            style={{ background: "var(--p-surface)", color: "var(--p-ink)", border: "1px solid var(--p-line)", "--tw-ring-color": "var(--p-accent)" }}
          />
          <p className={"font-mono text-[0.76rem] mt-2 " + (centered ? "text-center" : "")} style={{ color: "var(--p-inkmuted)" }} aria-live="polite">{note}</p>
          {onAskStoavia && atrium.status !== "off" && (
            <div className={"mt-1 " + (centered ? "text-center" : "")}>
              <button type="button" onClick={() => onAskStoavia("I'm in " + shop.name + ". What should a first-time visitor look at here, and why?")}

                <StoaviaMark size={20} /> Not sure? Ask Stoavia about this shop

            </div>
          )}
        </form>

        {shelf}

/* ---------- the walk-through ---------- */

function liteDevice() {
  try { return window.matchMedia("(max-width: 900px), (pointer: coarse)").matches || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent); } catch (e) { return false; }
}

function usePrefersReducedMotion() {
  const [reduced, setReduced] = useState(() => {
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches || liteDevice(); } catch (e) { return false; }
  });
  useEffect(() => {
    try {
      const m = window.matchMedia("(prefers-reduced-motion: reduce)");
      const f = () => setReduced(m.matches || liteDevice());
      m.addEventListener("change", f);
      return () => m.removeEventListener("change", f);
    } catch (e) {}
  }, []);
  return reduced;
}

function ScaledFront({ shop, onPick }) {
  const boxRef = useRef(null);
  const [k, setK] = useState(0.5);
  useEffect(() => {
    const el = boxRef.current;
    if (!el) return;
    const measure = () => setK(el.clientWidth / 860);
    measure();
    let ro;
    try { ro = new ResizeObserver(measure); ro.observe(el); } catch (e) { window.addEventListener("resize", measure); }
    return () => { try { ro && ro.disconnect(); } catch (e) {} window.removeEventListener("resize", measure); };
  }, []);
  return (
    <div ref={boxRef} className="w-full rounded-xl overflow-hidden" style={{ height: 560 * k, background: "var(--mall-wall)" }}>
      <div style={{ width: 820, height: 520, transform: "translate(" + 20 * k + "px, " + 20 * k + "px) scale(" + k + ")", transformOrigin: "0 0" }}>
        <StoreFront shop={shop} w={820} h={520} headed={false} onPick={onPick} />
      </div>
    </div>
  );
}

const STOCK = [
  { name: "Trail Runner Low", size: 9, price: 1899, tag: "Running" },
  { name: "Court Classic", size: 10, price: 1299, tag: "Lifestyle" },
  { name: "Featherweight Racer", size: 8, price: 2499, tag: "Running" },
  { name: "Street Slip-On", size: 9, price: 999, tag: "Lifestyle" },
  { name: "All-Terrain Boot", size: 11, price: 2899, tag: "Outdoor" },
  { name: "Court Classic XT", size: 11, price: 1499, tag: "Lifestyle" },
  { name: "Trail Runner Low", size: 11, price: 1899, tag: "Running" },
  { name: "Featherweight Racer Pro", size: 11, price: 2199, tag: "Running" }
];

const TAGS = ["running", "lifestyle", "outdoor"];

function runAssistantQuery(query) {
  const q = (query || "").toLowerCase().replace(/,/g, "");
  let items = STOCK.slice();
  const descriptors = [];

  const sizeMatch = q.match(/size\s*(\d{1,2})/);
  if (sizeMatch) {
    const size = parseInt(sizeMatch[1], 10);
    items = items.filter((i) => i.size === size);
    descriptors.push("size " + size);
  }

  const tag = TAGS.find((t) => q.includes(t) || (t === "outdoor" && /boot|hiking|trail/.test(q) && !q.includes("running")));
  if (tag) {
    items = items.filter((i) => i.tag.toLowerCase() === tag);
    descriptors.push(tag);
  }

  const underMatch = q.match(/(?:under|below|less than|max|up to)\s*r?\s*(\d{2,6})/);
  if (underMatch) {
    const maxPrice = parseInt(underMatch[1], 10);
    items = items.filter((i) => i.price < maxPrice);
    descriptors.push("under R" + maxPrice.toLocaleString("en-ZA"));
  }
  const overMatch = q.match(/(?:over|above|more than|min)\s*r?\s*(\d{2,6})/);
  if (overMatch) {
    const minPrice = parseInt(overMatch[1], 10);
    items = items.filter((i) => i.price > minPrice);
    descriptors.push("over R" + minPrice.toLocaleString("en-ZA"));
  }

  let sortDir = null;
  if (/(low to high|cheapest|ascending|lowest first)/.test(q)) sortDir = "asc";
  if (/(high to low|most expensive|descending|highest first)/.test(q)) sortDir = "desc";
  if (sortDir === "asc") {
    items = items.slice().sort((a, b) => a.price - b.price);
    descriptors.push("price low to high");
  } else if (sortDir === "desc") {
    items = items.slice().sort((a, b) => b.price - a.price);
    descriptors.push("price high to low");
  }

  let note;
  if (descriptors.length === 0) {
    note = q.trim() === ""
      ? "Showing all " + STOCK.length + " pairs. Type a size, a price, a style or a sort order."
      : "No size, price, style or sort found in that yet. Showing all " + STOCK.length + " pairs.";
  } else {
    note = "Showing " + items.length + " of " + STOCK.length + ": " + descriptors.join(", ") + ".";
  }
  return { items, note, descriptors };
}

function App() {
  const [myCfg, setMyCfg] = useState(() => loadCfg());
  const [orders, setOrders] = useState({});
  const [atriumOpen, setStoaviaOpen] = useState(false);
  const [atriumPending, setStoaviaPending] = useState(null);
  const mallApi = useRef(null);

  /* a shelf order Stoavia suggested (and the owner applied) reorders that shop's products everywhere */
  const withOrder = (s) => {
    const o = orders[s.id];
    if (!o) return s;
    const rank = (n) => { const i = o.indexOf(n); return i < 0 ? 999 : i; };
    return { ...s, products: s.products.slice().sort((a, b) => rank(a.name) - rank(b.name)) };
  };
  const myShop = useMemo(() => (myCfg ? makeShop(myCfg) : null), [myCfg]);
  const shops = useMemo(() => SHOPS.concat(myShop ? [myShop] : []).map(withOrder), [myShop, orders]);
  const applyOrder = (id, order) => setOrders((o) => { const n = { ...o }; if (order) n[id] = order; else delete n[id]; return n; });

  const openShop = (cfg) => {
    saveCfg(cfg);
    setMyCfg(cfg);
    setTimeout(() => { mallApi.current && mallApi.current.visit("mine"); }, 60);
  };
  const removeShop = () => { clearCfg(); setMyCfg(null); applyOrder("mine", null); };
  const askStoavia = (question) => { if (question) setStoaviaPending(question); setStoaviaOpen(true); };

  return (
    <div>
      <a href="#route" className="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:m-3 focus:px-4 focus:py-2 focus:rounded-full focus:bg-surface focus:text-ink">Skip to content</a>
      <Masthead onStoavia={askStoavia} />
      <main>
        <MallEntrance shops={shops} apiRef={mallApi} orders={orders} onApplyOrder={applyOrder} onAskStoavia={askStoavia} />
        <RouteSection />
        <ShopBuilder myShop={myShop} onOpen={openShop} onRemove={removeShop} orders={orders} onApplyOrder={applyOrder} withOrder={withOrder} />
        <AssistantSection />
        <ShelvesSection />
        <AudiencesSection />
        <CtaBand />
      </main>
      <Footer />
      <StoaviaPanel open={atriumOpen} onClose={() => setStoaviaOpen(false)} shops={shops} mallApi={mallApi}
        pending={atriumPending} clearPending={() => setStoaviaPending(null)} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<StoaviaProvider><App /></StoaviaProvider>);
